<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>CINE Momo— Explorateur de films</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f4f2;background:#101114;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -24%,#34343d 0,transparent 46%),#101114}.shell{max-width:1190px;margin:auto;padding:30px 34px 54px}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:19px;border-bottom:1px solid #ffffff17}.brand{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:800;letter-spacing:.16em}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#d9f36a;color:#151711;font-size:15px}.top-note{color:#92939d;font-size:12px}.hero{padding:58px 0 32px}.kicker{color:#d9f36a;text-transform:uppercase;font-weight:700;font-size:10px;letter-spacing:.2em}.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.02;letter-spacing:-.055em;margin:13px 0}.hero p{color:#a6a6ae;font-size:14px;line-height:1.7;margin:0;max-width:480px}.tools{display:flex;gap:11px;align-items:center;justify-content:space-between;margin-bottom:25px}.search{position:relative;flex:1;max-width:380px}.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#93949c;font-size:16px}.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid #ffffff1e;border-radius:9px;background:#1a1b20;color:#fff;font:inherit;font-size:12px;outline:none}.search input:focus{border-color:#d9f36a}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid #ffffff20;background:transparent;color:#b3b4bb;border-radius:99px;padding:9px 13px;font:inherit;font-size:11px;cursor:pointer;transition:.2s}.filter:hover{border-color:#d9f36a;color:#fff}.filter.active{border-color:#d9f36a;background:#d9f36a;color:#171912;font-weight:700}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-head h2{margin:0;font-size:13px;letter-spacing:.02em}.count{font-size:11px;color:#999aa2}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.card{overflow:hidden;border:1px solid #ffffff12;border-radius:12px;background:#191a1f;animation:appear .5s both;transition:transform .25s,border-color .25s,box-shadow .25s}.card:hover{transform:translateY(-5px);border-color:#d9f36a55;box-shadow:0 18px 40px #0005}.poster{position:relative;display:flex;align-items:flex-end;overflow:hidden;aspect-ratio: .77;padding:18px;background:var(--poster);isolation:isolate}.poster:before,.poster:after{content:"";position:absolute;z-index:-1}.poster:before{width:210px;height:210px;border:1px solid #ffffff42;border-radius:50%;right:-70px;top:-37px;box-shadow:0 0 0 18px #ffffff0a,0 0 0 44px #ffffff08}.poster:after{inset:35% 0 0;background:linear-gradient(transparent,#08090de8)}.poster-mark{position:absolute;top:16px;left:17px;color:#ffffffb8;font-size:8px;letter-spacing:.19em;text-transform:uppercase}.poster-glyph{position:absolute;right:17px;top:48%;transform:translateY(-50%);font-size:clamp(60px,9vw,105px);font-weight:800;line-height:1;color:#ffffff50;text-shadow:0 12px 40px #0006}.poster h3{position:relative;margin:0;font-size:clamp(19px,2.1vw,27px);line-height:.98;letter-spacing:-.045em;text-transform:uppercase;max-width:85%;text-shadow:0 2px 18px #0008}.fav{position:absolute;top:11px;right:11px;z-index:1;width:34px;height:34px;border:1px solid #ffffff42;border-radius:50%;background:#10111477;color:white;cursor:pointer;font-size:17px;backdrop-filter:blur(8px);transition:.2s}.fav:hover,.fav.saved{background:#d9f36a;border-color:#d9f36a;color:#171912}.meta{padding:13px 14px 14px}.meta-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.genre{color:#d9f36a;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.rating{color:#f4ce70;font-size:10px;white-space:nowrap}.year{color:#92939c;font-size:10px;margin-top:7px}.empty{grid-column:1/-1;padding:48px 20px;text-align:center;color:#a5a6ae;border:1px dashed #ffffff28;border-radius:12px;font-size:13px}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:16px;border-top:1px solid #ffffff17;color:#777983;font-size:10px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tools{align-items:flex-start;flex-direction:column}.search{max-width:none;width:100%}}@media(max-width:600px){.shell{padding:20px 17px 36px}.top-note{display:none}.hero{padding:44px 0 25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.poster{padding:13px}.poster h3{font-size:19px}.poster-glyph{font-size:66px}.meta{padding:11px}.filters{gap:6px}.filter{padding:8px 10px}.footer{font-size:9px}}@media(max-width:370px){.grid{grid-template-columns:1fr 1fr}.poster h3{font-size:16px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="mark" aria-hidden="true">▶</span> CADRE</div><div class="top-note">Un bon film commence par une découverte.</div></header>
    <section class="hero"><div class="kicker">Votre prochaine séance</div><h1>Le cinéma,<br>à portée de regard.</h1><p>Parcourez une sélection de films, explorez par genre et gardez vos coups de cœur sous la main.</p></section>
    <section aria-label="Explorer les films">
      <div class="tools"><label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">Rechercher un film</span><input id="search" type="search" placeholder="Titre ou genre…" autocomplete="off"></label><div class="filters" id="filters" aria-label="Filtrer par genre"></div></div>
      <div class="section-head"><h2 id="sectionTitle">À découvrir</h2><span class="count" id="count" aria-live="polite"></span></div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </section>
    <footer class="footer"><span>Une sélection fictive pour les amoureux du cinéma.</span><span>CADRE · 2026</span></footer>
  </main>
  <script>
    const films=[
      {id:'dune',title:'Dune : Deuxième partie',year:2024,genre:'Science-fiction',rating:'8.5',glyph:'Ⅱ',poster:'linear-gradient(145deg,#d39b5a,#744b38 57%,#282128)'},
      {id:'perfect-days',title:'Perfect Days',year:2023,genre:'Drame',rating:'7.9',glyph:'日',poster:'linear-gradient(145deg,#91bda1,#426e6a 55%,#1b3441)'},
      {id:'spiderverse',title:'Across the Spider-Verse',year:2023,genre:'Animation',rating:'8.6',glyph:'✳',poster:'linear-gradient(145deg,#f36b51,#aa3d69 52%,#313775)'},
      {id:'past-lives',title:'Past Lives',year:2023,genre:'Romance',rating:'7.8',glyph:'∞',poster:'linear-gradient(145deg,#d99b81,#826879 55%,#3a465c)'},
      {id:'oppenheimer',title:'Oppenheimer',year:2023,genre:'Drame',rating:'8.3',glyph:'◎',poster:'linear-gradient(145deg,#ef9a4b,#b44e3b 55%,#382b34)'},
      {id:'arrival',title:'Premier Contact',year:2016,genre:'Science-fiction',rating:'7.9',glyph:'◉',poster:'linear-gradient(145deg,#788e91,#3c5765 55%,#232e3a)'},
      {id:'amelie',title:'Le Fabuleux Destin d’Amélie Poulain',year:2001,genre:'Romance',rating:'8.3',glyph:'♥',poster:'linear-gradient(145deg,#e4965f,#bd5140 55%,#47302d)'},
      {id:'soul',title:'Soul',year:2020,genre:'Animation',rating:'8.0',glyph:'♫',poster:'linear-gradient(145deg,#7cbcb7,#466a98 55%,#272c5a)'}
    ];
    const genres=['Tous',...new Set(films.map(film=>film.genre)),'Favoris'];
    const grid=document.querySelector('#grid'),search=document.querySelector('#search'),filters=document.querySelector('#filters');
    let selected='Tous',query='';
    const favorites=new Set(JSON.parse(localStorage.getItem('cadre-favorites')||'[]'));
    function renderFilters(){filters.replaceChildren();genres.forEach(genre=>{const button=document.createElement('button');button.type='button';button.className=`filter${selected===genre?' active':''}`;button.textContent=genre;button.setAttribute('aria-pressed',String(selected===genre));button.addEventListener('click',()=>{selected=genre;renderFilters();renderFilms()});filters.append(button)})}
    function card(film,index){const article=document.createElement('article');article.className='card';article.style.animationDelay=`${Math.min(index,7)*45}ms`;
      const poster=document.createElement('div');poster.className='poster';poster.style.setProperty('--poster',film.poster);poster.setAttribute('role','img');poster.setAttribute('aria-label',`Affiche graphique de ${film.title}`);
      const mark=document.createElement('span');mark.className='poster-mark';mark.textContent=`CADRE · ${film.year}`;
      const glyph=document.createElement('span');glyph.className='poster-glyph';glyph.setAttribute('aria-hidden','true');glyph.textContent=film.glyph;
      const title=document.createElement('h3');title.textContent=film.title;
      const favorite=document.createElement('button');favorite.type='button';favorite.className=`fav${favorites.has(film.id)?' saved':''}`;favorite.textContent=favorites.has(film.id)?'♥':'♡';favorite.setAttribute('aria-label',favorites.has(film.id)?`Retirer ${film.title} des favoris`:`Ajouter ${film.title} aux favoris`);favorite.setAttribute('aria-pressed',String(favorites.has(film.id)));favorite.addEventListener('click',()=>{favorites.has(film.id)?favorites.delete(film.id):favorites.add(film.id);localStorage.setItem('cadre-favorites',JSON.stringify([...favorites]));renderFilms()});poster.append(mark,glyph,title,favorite);
      const meta=document.createElement('div');meta.className='meta';const line=document.createElement('div');line.className='meta-line';const genre=document.createElement('span');genre.className='genre';genre.textContent=film.genre;const rating=document.createElement('span');rating.className='rating';rating.textContent=`★ ${film.rating}`;const year=document.createElement('div');year.className='year';year.textContent=String(film.year);line.append(genre,rating);meta.append(line,year);article.append(poster,meta);return article}
    function renderFilms(){const normalized=query.trim().toLocaleLowerCase('fr');const visible=films.filter(film=>{const matchesGenre=selected==='Tous'||(selected==='Favoris'?favorites.has(film.id):film.genre===selected);const matchesQuery=`${film.title} ${film.genre} ${film.year}`.toLocaleLowerCase('fr').includes(normalized);return matchesGenre&&matchesQuery});grid.replaceChildren();if(!visible.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Aucun film ne correspond. Essayez une autre recherche ou un autre filtre.';grid.append(empty)}else visible.forEach((film,index)=>grid.append(card(film,index)));document.querySelector('#count').textContent=`${visible.length} film${visible.length>1?'s':''}`;document.querySelector('#sectionTitle').textContent=selected==='Favoris'?'Vos favoris':'À découvrir'}
    search.addEventListener('input',event=>{query=event.target.value;renderFilms()});renderFilters();renderFilms();
  </script>
</body>
</html>
